<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi Andreita</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0e0a14;color:#fff;font-family:Inter;overflow-x:hidden}
h1{font-family:'Cormorant Garamond',serif}
section{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 30%, #3a2a4a 0%, #1a1225 50%, #0e0a14 100%)}
.stars span{position:absolute;width:2px;height:2px;background:white;border-radius:50%;opacity:.7}
.boxes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:20px 0}
.box{width:85px;height:85px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.box b{font-size:28px;font-family:'Cormorant Garamond'} .box i{font-style:normal;font-size:9px;letter-spacing:2px;opacity:.6}
.pill{padding:10px 22px;border-radius:25px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:white;cursor:pointer;letter-spacing:1px}
.pill:hover{background:white;color:#1a1225}
.hidden{display:none!important}
</style>
</head>
<body>
<section id="s1"><div class="bg"></div>
<p style="font-size:11px;letter-spacing:4px;opacity:.7">COMO TE AMO MI ANDREITA</p>
<h1 style="font-size:42px;margin-top:10px">Su día especial<br><i>está por llegar</i></h1>
<p style="opacity:.5;font-size:12px;margin-top:8px">Someone very special birthday soon ♡</p>
<div class="boxes">
<div class="box"><b id="d">00</b><i>DAYS</i></div>
<div class="box"><b id="h">00</b><i>HOURS</i></div>
<div class="box"><b id="m">00</b><i>MINS</i></div>
<div class="box"><b id="s">00</b><i>SECS</i></div>
</div>
<button class="pill" onclick="document.getElementById('s1').classList.add('hidden');document.getElementById('s2').classList.remove('hidden')">♡ ver su sorpresa ♡</button>
<p style="margin-top:12px;font-size:10px;opacity:.4;letter-spacing:2px">HAY COSAS ESPERANDO PARA TI</p>
</section>

<section id="s2" class="hidden"><div class="bg"></div>
<h1 style="font-size:48px">¡Ya casi es!<br><i>mi Andreita</i></h1>
<p style="opacity:.6;margin-top:10px">Tu regalo ya está listo ♡</p>
</section>

<script>
// === CAMBIA SOLO ESTA FECHA ===
const BIRTHDAY = new Date("2026-10-15T00:00:00"); // Año-Mes-Dia

function tick(){
  let diff = BIRTHDAY - new Date();
  if(diff < 0) diff = 0;
  const d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);
  document.getElementById('d').textContent=String(d).padStart(2,'0');
  document.getElementById('h').textContent=String(h).padStart(2,'0');
  document.getElementById('m').textContent=String(m).padStart(2,'0');
  document.getElementById('s').textContent=String(s).padStart(2,'0');
}
setInterval(tick,1000); tick();
</script>
</body>
</html>
